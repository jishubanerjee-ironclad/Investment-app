<link rel="stylesheet" href="/static/style.css">
<div class="box">
<h2>Admin Panel</h2>
<table>
<tr><th>User</th><th>Stock</th><th>Qty</th><th>Price</th><th>Date</th></tr>
{% for d in data %}
<tr>
<td>{{d.username}}</td>
<td>{{d.stock}}</td>
<td>{{d.qty}}</td>
<td>{{d.price}}</td>
<td>{{d.date}}</td>
</tr>
{% endfor %}
</table>
</div>
